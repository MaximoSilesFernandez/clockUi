services:
  cliente:
    build:
      context: ./
    command: npm run dev
    ports:
      - "5173:5173"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          initial_sync: true
          ignore:
            - dist/
            - node_modules/
        - action: sync+restart
          path: ./vite.config.js
          target: /app
        - action: rebuild
          path: ./package.json
volumes:
  data: